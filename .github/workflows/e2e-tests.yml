name: E2E Smoke Tests

# The Playwright suite exercises the whole stack (seeded FastAPI backend +
# production Next.js build), so it triggers on changes to either side.
on:
  push:
    branches: [main, V2]
    paths:
      - "aws-advisor-ui/**"
      - "aws-instance-advisor/**"
      - ".github/workflows/e2e-tests.yml"
  pull_request:
    branches: [main, V2]
    paths:
      - "aws-advisor-ui/**"
      - "aws-instance-advisor/**"
      - ".github/workflows/e2e-tests.yml"

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aws-instance-advisor/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aws-advisor-ui/package-lock.json

      - name: Install backend dependencies
        working-directory: aws-instance-advisor
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        # Mirror the vitest-and-build job: npm ci with optional deps, plus the
        # rolldown native-binding repair (see that workflow for the full
        # root-cause write-up).
        working-directory: aws-advisor-ui
        run: |
          set -euo pipefail
          npm ci --include=optional
          LOCKED=$(node -p "require('./package-lock.json').packages['node_modules/rolldown'].version")
          if ! node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" 2>/dev/null; then
            npm install --no-save --no-audit --no-fund "@rolldown/binding-linux-x64-gnu@$LOCKED"
          fi
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Install Playwright browsers
        working-directory: aws-advisor-ui
        run: npx playwright install --with-deps chromium

      - name: Build production frontend
        working-directory: aws-advisor-ui
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run Playwright smoke suite
        # playwright.config.ts starts both webServers itself: the seeded
        # backend (scripts/dev_seed_and_serve.py, no live calls) and
        # `next start`. CI sets reuseExistingServer: false so a stray
        # server can never mask a broken config.
        working-directory: aws-advisor-ui
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: aws-advisor-ui/test-results/
          retention-days: 7
