name: Frontend Tests

on:
  push:
    branches: [main, V2, "feature/**", "feat/**"]
  pull_request:
    branches: [main, V2]

jobs:
  vitest-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aws-advisor-ui/package-lock.json

      - name: Install dependencies
        working-directory: aws-advisor-ui
        run: npm install

      - name: Run Vitest suite
        working-directory: aws-advisor-ui
        run: npm test

      - name: Build production bundle
        working-directory: aws-advisor-ui
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
