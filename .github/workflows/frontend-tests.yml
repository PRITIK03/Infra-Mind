name: Frontend Tests

on:
  push:
    branches: [main, V2, "feature/**", "feat/**"]
  pull_request:
    branches: [main, V2]

jobs:
  vitest-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aws-advisor-ui/package-lock.json

      - name: Install dependencies
        working-directory: aws-advisor-ui
        # `npm ci` installs strictly from package-lock.json and — unlike a
        # plain `npm install` against a pre-existing node_modules — reliably
        # installs platform-specific optional dependencies. Without
        # `--include=optional`, npm's known optional-dependency bug
        # (npm/cli#4828) can omit @rolldown/binding-linux-x64-gnu, which
        # makes vitest fail at startup with "Cannot find native binding".
        run: npm ci --include=optional

      - name: Verify native binding is present
        working-directory: aws-advisor-ui
        run: |
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" \
            || echo "::warning::@rolldown/binding-linux-x64-gnu missing — vitest may fail to start"

      - name: Run Vitest suite
        working-directory: aws-advisor-ui
        run: npm test

      - name: Build production bundle
        working-directory: aws-advisor-ui
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
