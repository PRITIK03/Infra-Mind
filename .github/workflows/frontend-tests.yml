name: Frontend Tests

on:
  push:
    branches: [main, V2, "feature/**", "feat/**"]
  pull_request:
    branches: [main, V2]

jobs:
  vitest-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aws-advisor-ui/package-lock.json

      - name: Install dependencies
        working-directory: aws-advisor-ui
        # `npm ci` installs strictly from package-lock.json. `--include=optional`
        # is required because npm would otherwise drop platform-specific
        # optional dependencies (npm/cli#4828).
        run: npm ci --include=optional

      - name: Ensure rolldown native binding
        working-directory: aws-advisor-ui
        # Belt-and-braces for npm/cli#4828: even with --include=optional the
        # linux binding can be skipped, which makes vitest 5 (rolldown-based)
        # exit immediately with "Cannot find native binding". Install exactly
        # the version matching the resolved rolldown package.
        run: |
          set -euo pipefail
          ROLLDOWN_VERSION=$(node -p "require('rolldown/package.json').version")
          echo "rolldown $ROLLDOWN_VERSION detected"
          if node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" 2>/dev/null; then
            echo "binding already present"
          else
            echo "installing @rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION"
            npm install --no-save "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION"
          fi
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      - name: Run Vitest suite
        working-directory: aws-advisor-ui
        run: npm test

      - name: Build production bundle
        working-directory: aws-advisor-ui
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
